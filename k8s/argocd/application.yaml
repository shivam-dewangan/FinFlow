apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: finflow

  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/shivam-dewangan/FinFlow.git

    targetRevision: main

    path: k8s

  destination:

    server: https://kubernetes.default.svc

    namespace: finflow

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:

      - CreateNamespace=true
